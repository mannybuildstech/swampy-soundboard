<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Swampy Soundboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="m-0 h-[100dvh] w-screen overflow-hidden">
    <div id="root"></div>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Force landscape layout when device is in portrait */
      @media (orientation: portrait) and (max-width: 1024px) {
        html, body {
          width: 100vw;
          height: 100svh;
        }
        #root {
          transform: rotate(90deg);
          transform-origin: top left;
          width: 100svh;
          height: 100vw;
          position: absolute;
          top: 0;
          left: 100vw;
          overflow: hidden;
        }
      }
    </style>
    <script>
      // Lock orientation on first user interaction (no fullscreen)
      function requestLandscape() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function() {});
        }
        document.removeEventListener('click', requestLandscape);
        document.removeEventListener('touchstart', requestLandscape);
      }
      document.addEventListener('click', requestLandscape, { once: true });
      document.addEventListener('touchstart', requestLandscape, { once: true });
    </script>
    <script type="text/babel" data-presets="react" src="./app.jsx"></script>
  </body>
</html>
