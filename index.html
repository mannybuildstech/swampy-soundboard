<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="screen-orientation" content="landscape" />
    <title>Swampy Soundboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="m-0 h-[100dvh] w-screen overflow-hidden">
    <div id="portrait-blocker" style="display:none;position:fixed;inset:0;z-index:9999;background:#1e1b4b;color:#7c3aed;font-family:system-ui,sans-serif;place-items:center;text-align:center;padding:2rem;">
      <div>
        <p style="font-size:4rem;">📱↪️</p>
        <p style="font-size:1.5rem;font-weight:800;margin-top:1rem;">Please rotate your device to landscape mode</p>
      </div>
    </div>
    <div id="root"></div>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100dvh;
      }

      @media (orientation: portrait) and (max-width: 1024px) {
        #portrait-blocker {
          display: grid !important;
        }
        #root {
          display: none !important;
        }
      }
    </style>
    <script>
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
    </script>
    <script type="text/babel" data-presets="react" src="./app.jsx"></script>
  </body>
</html>
